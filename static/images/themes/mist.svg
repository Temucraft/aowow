<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <!-- Temucraft themes: drifting fog, drawn (very soft noise), tiles sideways without seams -->
  <filter id="m" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".0039 .0078" numOctaves="4" seed="21" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .92  0 0 0 0 .97  0 0 0 0 .95  0 0 0 2.2 -1.05"/>
  </filter>
  <rect width="1024" height="512" filter="url(#m)"/>
</svg>
